[project]
name = "predicitve-coding"
version = "0.1.0"
description = "A predictive-coding network in PyTorch, compared against an equivalent MLP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "iprogress>=0.4",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.0",
    "mujoco>=3.11.0",
    "notebook>=7.6.0",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "plotly>=6.9.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.11",
    "seaborn>=0.13.2",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.69.0",
]

[project.scripts]
pcn-comparison = "comparison.run_experiment:main"
pcn-gridsearch = "gridsearch.run_gridsearch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcn", "src/comparison", "src/gridsearch"]
